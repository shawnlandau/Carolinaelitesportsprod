# Netlify Configuration File

[build]
  publish = "."
  command = "echo 'No build command needed for static HTML site'"

# Redirect rules for clean URLs (optional)
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 200

# Form submissions
[[forms]]
  name = "contact"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 404 page (optional - can create custom 404.html later)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
